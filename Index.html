<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Masonde">
<link rel="apple-touch-icon" href="icon.png">
<title>Masonde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #241443;
    --bg-deep-2: #331a5c;
    --yellow: #FFD23F;
    --blue: #4CC9F0;
    --coral: #FF6B6B;
    --green: #6BCB77;
    --pink: #F72585;
    --ink: #241443;
    --paper: #FFF8EC;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(circle at 50% -10%, var(--bg-deep-2), var(--bg-deep) 60%);
    font-family: 'Fredoka', system-ui, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  #app{
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{
    flex: 0 0 auto;
    text-align: center;
    padding: 14px 0 6px;
  }
  header .logo{
    display:inline-block;
    font-size: 22px;
    font-weight: 700;
    color: var(--paper);
    letter-spacing: 0.5px;
    opacity: 0.85;
  }
  #questionRow{
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #question{
    font-size: clamp(18px, 5vw, 26px);
    font-weight: 700;
    color: var(--yellow);
  }
  #repeatBtn{
    font-size: 22px;
    line-height: 1;
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
  }
  #repeatBtn:active{ transform: scale(0.92); }
  .card.wrong{ animation: shake 420ms ease; }
  @keyframes shake{
    10%,90%{ transform: translateX(-6px); }
    20%,80%{ transform: translateX(8px); }
    30%,50%,70%{ transform: translateX(-10px); }
    40%,60%{ transform: translateX(10px); }
  }
  #grid{
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 18px;
    padding: 8px 18px;
    min-height: 0;
  }
  .card{
    position: relative;
    border: none;
    border-radius: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(20vw, 130px);
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 10px 0 rgba(0,0,0,0.18), 0 14px 26px rgba(0,0,0,0.28);
    transform: translateY(0);
    transition: transform 90ms ease, box-shadow 90ms ease;
    overflow: hidden;
  }
  .card:active{
    transform: translateY(8px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.18), 0 6px 14px rgba(0,0,0,0.24);
  }
  .card.bounce{ animation: bounce 520ms ease; }
  @keyframes bounce{
    0%{ transform: scale(1); }
    30%{ transform: scale(0.90); }
    55%{ transform: scale(1.10); }
    100%{ transform: scale(1); }
  }
  .c0{ background: var(--yellow); }
  .c1{ background: var(--blue); }
  .c2{ background: var(--coral); }
  .c3{ background: var(--green); }

  .word-label{
    position: absolute;
    left: 0;
    right: 0;
    bottom: 10%;
    text-align: center;
    font-family: 'Fredoka', system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 7vw, 40px);
    color: var(--ink);
    background: rgba(255, 248, 236, 0.92);
    padding: 4px 14px;
    border-radius: 999px;
    margin: 0 12%;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 180ms ease, transform 180ms ease;
    pointer-events: none;
  }
  .word-label.show{
    opacity: 1;
    transform: translateY(0);
  }

  .spark{
    position: absolute;
    font-size: 34px;
    pointer-events: none;
    animation: fly 700ms ease-out forwards;
  }
  @keyframes fly{
    0%{ transform: translate(0,0) scale(0.6) rotate(0deg); opacity: 1; }
    100%{ transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); opacity: 0; }
  }

  footer{
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    padding: 16px 18px calc(18px + env(safe-area-inset-bottom));
  }
  #next{
    font-family: inherit;
    font-weight: 700;
    font-size: 26px;
    color: var(--paper);
    background: var(--pink);
    border: none;
    border-radius: 999px;
    padding: 18px 56px;
    box-shadow: 0 8px 0 #b5195f, 0 14px 22px rgba(0,0,0,0.35);
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: transform 90ms ease, box-shadow 90ms ease;
  }
  #next:active{
    transform: translateY(6px);
    box-shadow: 0 2px 0 #b5195f, 0 6px 12px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">Masonde</span>
    <div id="questionRow">
      <span id="question"></span>
      <button id="repeatBtn" aria-label="Repeat question">🔊</button>
    </div>
  </header>
  <div id="grid"></div>
  <footer><button id="next">Next</button></footer>
</div>

const COLORS = ["c0","c1","c2","c3"];
const grid = document.getElementById("grid");
const nextBtn = document.getElementById("next");
const questionEl = document.getElementById("question");
const repeatBtn = document.getElementById("repeatBtn");

let voicesReady = false;
if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = () => { voicesReady = true; };
}

function pickBestVoice(){
  if (!("speechSynthesis" in window)) return null;
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  // "Google" network voices (common on Android Chrome) are fuller and
  // noticeably louder/clearer than the default on-device voice, so prefer
  // those first. British English matches the show's accent.
  return voices.find(v => v.lang === "en-GB" && /Google/i.test(v.name)) ||
         voices.find(v => /Google/i.test(v.name) && v.lang && v.lang.startsWith("en")) ||
         voices.find(v => v.lang === "en-GB") ||
         voices.find(v => v.lang && v.lang.startsWith("en")) ||
         voices[0];
}

let activeUtterance = null; // iOS Safari silently drops speech if the utterance object gets garbage-collected mid-playback; keeping a live reference here prevents that.

function speakText(text, opts = {}){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const voice = pickBestVoice();
  if (voice) utter.voice = voice;
  utter.lang = (voice && voice.lang) || "en-GB";
  utter.rate = opts.rate ?? 0.6;
  utter.pitch = opts.pitch ?? 1.15;
  utter.volume = 1; // max — the Web Speech API cannot exceed the phone's own media volume
  activeUtterance = utter;
  speechSynthesis.speak(utter);
}

function speakWord(entry){
  if (entry.audio) {
    const a = new Audio(entry.audio);
    a.volume = 1;
    a.play().catch(() => speakText(entry.word));
    return;
  }
  speakText(entry.word);
}

function shuffledSample(arr, n){
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, n);
}

const SPARKS = ["✨","⭐","🎉","💫"];
const PRAISE = ["Perfect!", "Well done!", "Yes! That's it!", "Great job!"];
const ENCOURAGE = ["Try again!", "Not quite, try again!", "Almost! Try again!"];

function celebrate(cardEl){
  cardEl.classList.remove("bounce");
  void cardEl.offsetWidth; // restart animation
  cardEl.classList.add("bounce");

  const rect = cardEl.getBoundingClientRect();
  for (let i = 0; i < 6; i++) {
    const s = document.createElement("span");
    s.className = "spark";
    s.textContent = SPARKS[Math.floor(Math.random() * SPARKS.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 60;
    s.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
    s.style.setProperty("--dy", `${Math.sin(angle) * dist}px`);
    s.style.setProperty("--rot", `${(Math.random() * 180 - 90)}deg`);
    s.style.left = `${rect.width / 2}px`;
    s.style.top = `${rect.height / 2}px`;
    cardEl.appendChild(s);
    setTimeout(() => s.remove(), 720);
  }
}

function shake(cardEl){
  cardEl.classList.remove("wrong");
  void cardEl.offsetWidth; // restart animation
  cardEl.classList.add("wrong");
}

/* ---- Quiz state ---- */
let currentRound = [];   // [{entry, card, label}, ...]
let targetIndex = -1;
let awaitingAnswer = true;
let advanceTimer = null;

function askQuestion(){
  awaitingAnswer = true;
  const target = currentRound[targetIndex];
  questionEl.textContent = `Which one is ${target.entry.word}?`;
  speakText(`Which one is ${target.entry.word}?`, { rate: 0.62 });
}

function handleAnswer(i){
  if (!awaitingAnswer) return;
  const chosen = currentRound[i];
  chosen.label.classList.add("show");

  if (i === targetIndex) {
    awaitingAnswer = false;
    celebrate(chosen.card);
    speakWord(chosen.entry);
    setTimeout(() => {
      speakText(PRAISE[Math.floor(Math.random() * PRAISE.length)], { rate: 0.7, pitch: 1.3 });
    }, 650);
    advanceTimer = setTimeout(startNewRound, 2200);
  } else {
    shake(chosen.card);
    speakWord(chosen.entry);
    setTimeout(() => {
      speakText(ENCOURAGE[Math.floor(Math.random() * ENCOURAGE.length)], { rate: 0.7, pitch: 0.95 });
    }, 650);
  }
}

function startNewRound(){
  clearTimeout(advanceTimer);
  const round = shuffledSample(WORDS, 4);
  grid.innerHTML = "";

  currentRound = round.map((entry, i) => {
    const card = document.createElement("button");
    card.className = `card ${COLORS[i]}`;
    card.setAttribute("aria-label", entry.word);
    card.textContent = entry.emoji;

    const label = document.createElement("span");
    label.className = "word-label";
    label.textContent = entry.word;
    card.appendChild(label);

    card.addEventListener("click", () => handleAnswer(i));
    grid.appendChild(card);
    return { entry, card, label };
  });

  targetIndex = Math.floor(Math.random() * 4);
  awaitingAnswer = false; // brief pause while pictures settle in, before the question is asked
  setTimeout(askQuestion, 500);
}

repeatBtn.addEventListener("click", () => {
  if (targetIndex >= 0) askQuestion();
});
nextBtn.addEventListener("click", startNewRound);

startNewRound();
</script>
